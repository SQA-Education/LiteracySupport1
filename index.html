<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Day — Reading & Writing Practice | SQA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#FAF7F2;
    --surface:#FFFFFF;
    --ink:#26201B;
    --muted:#8A8178;
    --purple:#5A3CB6;
    --purple-deep:#43289A;
    --purple-soft:#EFE9FB;
    --orange:#ED7D29;
    --orange-soft:#FCE9D6;
    --green:#2E9E5B;
    --green-soft:#E3F4EA;
    --line:#ECE5DC;
    --radius:20px;
    --shadow:0 10px 40px rgba(67,40,154,0.08), 0 2px 8px rgba(38,32,27,0.04);
    --font-ui:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-read:'Lexend', system-ui, -apple-system, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-ui);
    font-size:18px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:24px 16px 80px;
    min-height:100vh;
  }

  .wrap{max-width:760px;margin:0 auto;}

  /* ---------- Header ---------- */
  .masthead{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:0 4px;}
  .mark{
    font-family:var(--font-read);font-weight:700;letter-spacing:0.06em;
    color:#fff;background:var(--purple);border-radius:10px;
    padding:6px 10px;font-size:15px;
  }
  .mast-label{color:var(--muted);font-size:14px;letter-spacing:0.04em;text-transform:uppercase;}

  /* ---------- Card ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:clamp(22px,5vw,40px);
  }

  /* ---------- Progress ---------- */
  .progress{margin-bottom:28px;}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
  .stage-name{font-family:var(--font-read);font-weight:600;font-size:clamp(18px,3.5vw,22px);color:var(--purple-deep);}
  .stage-count{color:var(--muted);font-size:14px;}
  .dots{display:flex;gap:8px;}
  .dot{height:8px;border-radius:99px;flex:1;background:var(--line);transition:background .3s;}
  .dot.done{background:var(--purple);}
  .dot.now{background:var(--orange);}

  /* ---------- Typography ---------- */
  h1{font-family:var(--font-read);font-weight:700;font-size:clamp(26px,6vw,38px);line-height:1.15;margin:0 0 12px;}
  .lead{font-size:clamp(17px,3.5vw,20px);color:var(--ink);margin:0 0 8px;}
  .sub{color:var(--muted);font-size:15px;margin:0 0 24px;}

  /* ---------- Sentence display ---------- */
  .stage-instructions{font-family:var(--font-read);font-weight:500;font-size:clamp(17px,3.5vw,20px);margin:0 0 20px;color:var(--ink);}
  .icon-badge{
    width:64px;height:64px;border-radius:50%;background:var(--purple-soft);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--purple-deep);
  }
  .icon-badge svg{width:34px;height:34px;}

  .sentence{
    font-family:var(--font-read);font-weight:500;
    font-size:clamp(28px,7vw,42px);line-height:1.45;
    word-spacing:0.14em;letter-spacing:0.005em;
    text-align:center;margin:0 0 8px;
  }
  .sentence .w{cursor:pointer;border-radius:8px;padding:2px 4px;transition:background .15s;}
  .sentence .w:hover,.sentence .w:focus-visible{background:var(--orange-soft);outline:none;}
  .sentence .w.lit{background:var(--orange-soft);}

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--font-ui);font-weight:700;font-size:17px;
    border:none;border-radius:14px;padding:14px 22px;cursor:pointer;
    transition:transform .08s, background .2s, box-shadow .2s;
    min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--orange);color:#fff;box-shadow:0 4px 14px rgba(237,125,41,0.32);}
  .btn-primary:hover{background:#e06f18;}
  .btn-primary:disabled{background:#E7DED4;color:#B3A99C;box-shadow:none;cursor:default;}
  .btn-ghost{background:#fff;color:var(--purple-deep);border:2px solid var(--purple-soft);}
  .btn-ghost:hover{border-color:var(--purple);}
  .btn-quiet{background:transparent;color:var(--muted);font-weight:400;min-height:auto;padding:8px 10px;border-radius:10px;}
  .btn-quiet:hover{color:var(--ink);background:var(--paper);}
  .listen{background:var(--purple-soft);color:var(--purple-deep);}
  .listen:hover{background:#e4daf7;}

  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:28px;}
  .actions-split{justify-content:space-between;}

  /* ---------- Word tiles (build) ---------- */
  .answer-line{
    min-height:74px;border:2px dashed var(--line);border-radius:16px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
    padding:14px;margin-bottom:8px;background:var(--paper);
  }
  .answer-line.full{border-style:solid;border-color:var(--green);background:var(--green-soft);}
  .placeholder{color:var(--muted);font-size:15px;}
  .pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px;}
  .tile{
    font-family:var(--font-read);font-weight:500;font-size:clamp(20px,5vw,28px);
    background:#fff;border:2px solid var(--purple-soft);color:var(--ink);
    border-radius:14px;padding:10px 18px;cursor:pointer;min-height:52px;
    transition:transform .08s, border-color .15s, background .15s;
  }
  .tile:hover{border-color:var(--purple);}
  .tile:active{transform:translateY(1px);}
  .tile.placed{background:var(--purple);color:#fff;border-color:var(--purple);}

  /* ---------- Spaces ---------- */
  .letterline{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;margin:12px 0 4px;gap:0;}
  .ltr{font-family:var(--font-read);font-size:clamp(28px,7vw,40px);font-weight:500;}
  .gap{
    width:16px;height:46px;cursor:pointer;border-radius:6px;position:relative;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .gap:hover{background:var(--orange-soft);}
  .gap.cut{width:30px;}
  .gap.cut::after{content:"";width:4px;height:30px;background:var(--orange);border-radius:99px;}
  .gap.cut.ok::after{background:var(--green);}

  /* ---------- Capitals & periods ---------- */
  .fixline{font-family:var(--font-read);font-size:clamp(28px,7vw,42px);font-weight:500;text-align:center;word-spacing:0.14em;margin:14px 0;}
  .tap-i,.tap-dot{
    cursor:pointer;border-radius:8px;padding:0 4px;border:2px dashed var(--orange);
    background:var(--orange-soft);transition:.15s;
  }
  .tap-i:hover,.tap-dot:hover{background:#f9d9b8;}
  .tap-i.fixed,.tap-dot.fixed{border-style:solid;border-color:var(--green);background:var(--green-soft);}
  .tap-dot{min-width:22px;display:inline-block;text-align:center;}

  /* ---------- Type ---------- */
  .model{
    font-family:var(--font-read);font-size:clamp(24px,6vw,34px);font-weight:500;
    text-align:center;word-spacing:0.14em;margin:6px 0 4px;
  }
  .type-input{
    width:100%;font-family:var(--font-read);font-size:clamp(20px,5vw,26px);
    padding:16px 18px;border:2px solid var(--purple-soft);border-radius:14px;
    background:#fff;color:var(--ink);margin-top:18px;
  }
  .type-input:focus{outline:none;border-color:var(--purple);}

  /* ---------- Write stage ---------- */
  .frame-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .frame-text{font-family:var(--font-read);font-size:clamp(18px,4.5vw,24px);font-weight:500;white-space:nowrap;}
  .frame-input{
    flex:1;min-width:140px;font-family:var(--font-read);font-size:clamp(18px,4.5vw,24px);
    padding:10px 14px;border:none;border-bottom:3px solid var(--purple-soft);
    background:transparent;color:var(--ink);
  }
  .frame-input:focus{outline:none;border-bottom-color:var(--orange);}
  .wordbank-label{font-size:14px;color:var(--muted);margin:18px 0 8px;}
  .wordbank{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    font-family:var(--font-read);font-size:16px;background:var(--purple-soft);color:var(--purple-deep);
    border:none;border-radius:99px;padding:8px 14px;cursor:pointer;
  }
  .chip:hover{background:#e4daf7;}

  /* ---------- Checklist ---------- */
  .checklist{background:var(--paper);border-radius:14px;padding:16px 18px;margin-top:22px;border:1px solid var(--line);}
  .checklist h3{margin:0 0 10px;font-family:var(--font-read);font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
  .checklist ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px 18px;}
  .checklist li{display:flex;align-items:center;gap:8px;font-size:16px;}
  .check-mark{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;}
  .check-mark.on{background:var(--green);border-color:var(--green);}

  /* ---------- Feedback ---------- */
  .feedback{min-height:30px;text-align:center;font-family:var(--font-read);font-weight:500;font-size:18px;margin-top:18px;}
  .feedback.good{color:var(--green);}
  .feedback.try{color:var(--orange);}

  /* ---------- Intro / Done ---------- */
  .center{text-align:center;}
  .big-emoji{font-size:54px;margin-bottom:8px;}
  .recap{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:20px 0;text-align:left;}
  .recap li{margin:6px 0;}

  .hint-toggle{display:block;margin:14px auto 0;}
  .hint{text-align:center;color:var(--muted);font-family:var(--font-read);font-size:clamp(20px,5vw,26px);margin-top:8px;}

  .field{text-align:left;margin:0 auto 16px;max-width:420px;}
  .field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;}
  .field input,.field select{width:100%;font-family:var(--font-read);font-size:20px;padding:13px 14px;border:2px solid var(--purple-soft);border-radius:14px;background:#fff;color:var(--ink);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--purple);}
  .warn{background:var(--orange-soft);border:1px solid var(--orange);border-radius:14px;padding:14px 16px;margin:18px 0;text-align:left;font-size:15px;color:#8a4b12;}
  .send-status{margin-top:14px;font-family:var(--font-read);font-weight:500;}

  /* reduced motion */
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <span class="mark">SQA</span>
    <span class="mast-label">Literacy Support</span>
  </div>
  <div class="card" id="app" aria-live="polite"></div>
</div>

<script>
/* ============================================================
   MY DAY — Reading & Writing Practice
   A gentle, multi-sensory literacy session for an adult learner.
   Content: Daily Routines. All progress is in-memory (no scoring,
   no pressure). Audio uses the browser's speech synthesis.
   ============================================================ */

/* ----------------------------------------------------------
   GOOGLE FORM CONFIG
   The entry IDs below follow the order your form questions
   appear in. If a value lands in the wrong column, just swap
   the entry numbers here to match your form.
   ---------------------------------------------------------- */
const FORM = {
  action: "https://docs.google.com/forms/d/e/1FAIpQLSedae-_HQUBR1Ruu0gj_nHDOSd9m7Dr_Md56Z70tO5q76kwag/formResponse",
  fields: {
    studentName: "entry.1219454690",
    teacher:     "entry.447570561",
    activity:    "entry.229020572",
    stages:      "entry.579553126",
    writing:     "entry.1041622934",
  }
};
const ACTIVITY_NAME = "My Day – Daily Routines (Literacy Support)";
const TEACHERS = ["Eunice Salazar","Hector Amaya","Laura Ebel","Jonelle Williams","Angela Gradiska"];

const SENTENCES = [
  { text: "I wake up early.",  words: ["I","wake","up","early"], icon: "sun" },
  { text: "I brush my teeth.", words: ["I","brush","my","teeth"], icon: "tooth" },
  { text: "I eat breakfast.",  words: ["I","eat","breakfast"], icon: "bowl" },
  { text: "I go to work.",     words: ["I","go","to","work"], icon: "bag" },
  { text: "I go home.",        words: ["I","go","home"], icon: "house" },
  { text: "I watch TV.",       words: ["I","watch","TV"], icon: "tv" },
  { text: "I go to bed.",      words: ["I","go","to","bed"], icon: "moon" },
];

const STAGES = [
  { key:"listen",   name:"Listen and read",        instr:"Listen, then read the sentence out loud. Tap any word to hear it again." },
  { key:"build",    name:"Put the words in order", instr:"Tap the words to build the sentence. Tap a word again to take it back." },
  { key:"spaces",   name:"Find the spaces",        instr:"These words are stuck together. Tap to put a space between each word." },
  { key:"capitals", name:"Capital I and a period", instr:"Tap the i to make a capital I. Tap the box to add a period." },
  { key:"type",     name:"Type the sentence",      instr:"Type the sentence. Use a capital I, spaces between words, and a period." },
  { key:"write",    name:"Write about your day",   instr:"Finish each sentence about your own day. There are no wrong answers." },
];

const ICONS = {
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="4"/><path d="M12 3v2M5.6 6.6l1.4 1.4M18.4 6.6l-1.4 1.4M3 13h2M19 13h2M3 20h18"/></svg>',
  tooth:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3c-2 0-4 1.5-4 4 0 2 .8 3 1 5 .3 2.5.5 8 2 8s1.3-4 3-4 1.5 4 3 4 1.7-5.5 2-8c.2-2 1-3 1-5 0-2.5-2-4-4-4-1.3 0-2 .7-3 .7S9.3 3 8 3Z"/></svg>',
  bowl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8Z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/></svg>',
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>',
  house:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>',
  tv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M12 6V3"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14a8 8 0 1 1-9-11 6 6 0 0 0 9 11Z"/></svg>',
  speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>',
};

/* ---------- speech ---------- */
let chosenVoice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  chosenVoice = voices.find(v=>/en[-_]US/i.test(v.lang) && /female|samantha|zira|google us/i.test(v.name))
            || voices.find(v=>/^en/i.test(v.lang)) || voices[0] || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.82; u.pitch = 1;
  if(chosenVoice) u.voice = chosenVoice;
  speechSynthesis.speak(u);
}

/* ---------- state ---------- */
const state = { screen:"intro", stage:0, index:0, student:"", teacher:"", writing:"" };
const app = document.getElementById('app');

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* ---------- progress bar ---------- */
function progressHTML(){
  const dots = STAGES.map((_,i)=>{
    const cls = i<state.stage?'done':(i===state.stage?'now':'');
    return `<span class="dot ${cls}"></span>`;
  }).join('');
  const s = STAGES[state.stage];
  return `<div class="progress">
    <div class="progress-top">
      <span class="stage-name">${s.name}</span>
      <span class="stage-count">Step ${state.stage+1} of ${STAGES.length}</span>
    </div>
    <div class="dots">${dots}</div>
  </div>`;
}

function listenBtn(text,label){
  return `<button class="btn listen" data-speak="${text.replace(/"/g,'&quot;')}" aria-label="${label||'Listen'}">${ICONS.speaker} Listen</button>`;
}

/* =========================================================
   SCREENS
   ========================================================= */

function renderIntro(){
  app.innerHTML = `
    <div class="center">
      <div class="big-emoji">☀️</div>
      <h1>My Day</h1>
      <p class="lead">Reading and writing practice, one small step at a time.</p>
      <p class="sub">You will read, listen, build, and write seven short sentences about a day.
      Take your time — you can listen as often as you like.</p>
      <div class="field">
        <label for="nm">Your name</label>
        <input id="nm" autocomplete="off" placeholder="Type your name" value="${state.student.replace(/"/g,'&quot;')}" />
      </div>
      <div class="field">
        <label for="tc">Your teacher</label>
        <select id="tc">
          <option value="">Choose your teacher</option>
          ${TEACHERS.map(t=>`<option value="${t}" ${state.teacher===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="start" disabled>Start →</button>
      </div>
    </div>`;
  const nm=app.querySelector('#nm'), tc=app.querySelector('#tc'), start=app.querySelector('#start');
  const check=()=>{ start.disabled = !(nm.value.trim() && tc.value); };
  nm.oninput=()=>{ state.student=nm.value.trim(); check(); };
  tc.onchange=()=>{ state.teacher=tc.value; check(); };
  check();
  start.onclick = ()=>{ state.stage=0; state.index=0; renderStage(); };
}

function renderStage(){
  const stage = STAGES[state.stage].key;
  if(stage==="listen")   return renderListen();
  if(stage==="build")    return renderBuild();
  if(stage==="spaces")   return renderSpaces();
  if(stage==="capitals") return renderCapitals();
  if(stage==="type")     return renderType();
  if(stage==="write")    return renderWrite();
}

function advance(){
  if(state.index < SENTENCES.length-1){ state.index++; renderStage(); }
  else { state.index=0; state.stage++; if(state.stage>=STAGES.length) renderDone(); else renderStage(); }
}
function goBack(){
  if(state.index>0){ state.index--; renderStage(); }
  else if(state.stage>0){ state.stage--; state.index=SENTENCES.length-1; renderStage(); }
  else renderIntro();
}

function sentenceCounter(){ return `<p class="sub center">Sentence ${state.index+1} of ${SENTENCES.length}</p>`; }
function wireSpeak(){ app.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak)); }
function navRow(nextLabel, nextEnabled){
  return `<div class="actions actions-split">
      <button class="btn btn-quiet" id="back">← Back</button>
      <button class="btn btn-primary" id="next" ${nextEnabled?'':'disabled'}>${nextLabel||'Next →'}</button>
    </div>`;
}
function wireNav(){
  const b=app.querySelector('#back'); if(b) b.onclick=goBack;
  const n=app.querySelector('#next'); if(n) n.onclick=advance;
}

/* ---------- 1. LISTEN ---------- */
function renderListen(){
  const s = SENTENCES[state.index];
  const words = s.text.split(' ').map(w=>`<span class="w" tabindex="0" data-word="${w.replace(/[.]/,'')}">${w}</span>`).join(' ');
  app.innerHTML = progressHTML() + `
    <p class="stage-instructions">${STAGES[0].instr}</p>
    <div class="icon-badge">${ICONS[s.icon]}</div>
    <p class="sentence" id="sent">${words}</p>
    ${sentenceCounter()}
    <div class="actions">${listenBtn(s.text)}</div>
    ${navRow()}`;
  wireSpeak();
  app.querySelectorAll('.w').forEach(w=>{
    const say=()=>{ app.querySelectorAll('.w').forEach(x=>x.classList.remove('lit')); w.classList.add('lit'); speak(w.dataset.word); };
    w.onclick=say; w.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();say();} };
  });
  // next always enabled here (listening is exploratory)
  const n=app.querySelector('#next'); n.removeAttribute('disabled');
  wireNav();
}

/* ---------- 2. BUILD ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function renderBuild(){
  const s = SENTENCES[state.index];
  let pool = shuffle(s.words.map((w,i)=>({w,id:i})));
  if(s.words.length>1 && pool.every((p,i)=>p.id===i)) pool = pool.reverse();
  let placed = [];

  function paint(){
    const done = placed.length===s.words.length && placed.every((p,i)=>p.w===s.words[i]);
    const ansInner = placed.length
      ? placed.map((p,i)=>`<button class="tile placed" data-place="${i}">${p.w}</button>`).join('')
      : `<span class="placeholder">Tap the words below, in order</span>`;
    const poolInner = pool.map(p=>`<button class="tile" data-pool="${p.id}">${p.w}</button>`).join('');
    app.innerHTML = progressHTML() + `
      <p class="stage-instructions">${STAGES[1].instr}</p>
      <div class="icon-badge">${ICONS[s.icon]}</div>
      <div class="answer-line ${done?'full':''}">${ansInner}</div>
      <div class="pool">${poolInner}</div>
      <div class="feedback ${done?'good':''}" role="status">${done?'That is a full sentence. Well done. ✓':''}</div>
      ${sentenceCounter()}
      <div class="actions">${listenBtn(s.text)}</div>
      ${navRow('Next →', done)}`;
    wireSpeak();
    app.querySelectorAll('[data-pool]').forEach(btn=>btn.onclick=()=>{
      const id=+btn.dataset.pool; const item=pool.find(p=>p.id===id);
      pool=pool.filter(p=>p.id!==id); placed.push(item); paint();
    });
    app.querySelectorAll('[data-place]').forEach(btn=>btn.onclick=()=>{
      const i=+btn.dataset.place; const item=placed[i];
      placed.splice(i,1); pool.push(item); paint();
    });
    if(done) speak(s.text);
    wireNav();
  }
  paint();
}

/* ---------- 3. SPACES ---------- */
function renderSpaces(){
  const s = SENTENCES[state.index];
  const lower = s.words.map(w=>w.toLowerCase());
  const run = lower.join('');
  // correct cut positions = cumulative word lengths, except the last
  const correct = new Set();
  let acc=0; for(let i=0;i<lower.length-1;i++){ acc+=lower[i].length; correct.add(acc); }
  let cuts = new Set();
  let solved=false;

  function paint(){
    let html='';
    for(let i=0;i<run.length;i++){
      html += `<span class="ltr">${run[i]}</span>`;
      if(i<run.length-1){
        const on=cuts.has(i+1);
        html += `<span class="gap ${on?'cut':''} ${on&&correct.has(i+1)?'ok':''}" data-gap="${i+1}" role="button" tabindex="0" aria-label="space"></span>`;
      }
    }
    solved = cuts.size===correct.size && [...cuts].every(c=>correct.has(c));
    app.innerHTML = progressHTML() + `
      <p class="stage-instructions">${STAGES[2].instr}</p>
      <div class="letterline">${html}</div>
      <div class="feedback ${solved?'good':''}" role="status">${solved?`Now I can read it: <b>${lower.join(' ')}</b> ✓`:''}</div>
      ${sentenceCounter()}
      <div class="actions">
        ${listenBtn(s.text)}
        <button class="btn btn-ghost" id="hint">Show me a hint</button>
      </div>
      ${navRow('Next →', solved)}`;
    wireSpeak();
    app.querySelectorAll('[data-gap]').forEach(g=>{
      const toggle=()=>{ const p=+g.dataset.gap; if(cuts.has(p)) cuts.delete(p); else cuts.add(p); paint(); };
      g.onclick=toggle; g.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();} };
    });
    app.querySelector('#hint').onclick=()=>{
      const fb=app.querySelector('.feedback'); fb.classList.add('try');
      fb.innerHTML=`The words are: <b>${lower.join(' &middot; ')}</b>`;
    };
    if(solved) speak(s.text);
    wireNav();
  }
  paint();
}

/* ---------- 4. CAPITALS & PERIODS ---------- */
function renderCapitals(){
  const s = SENTENCES[state.index];
  // base: correct internal capitals, but first letter lowercase and no period
  const noDot = s.text.replace(/[.]$/,'');
  const rest = noDot.slice(1); // keeps "I" -> the leading char handled separately
  let capDone=false, dotDone=false;

  function paint(){
    const firstChar = capDone ? 'I' : 'i';
    const dot = dotDone ? '<span class="tap-dot fixed" id="dot">.</span>' : '<span class="tap-dot" id="dot" role="button" tabindex="0" aria-label="add period">＿</span>';
    const iSpan = `<span class="tap-i ${capDone?'fixed':''}" id="capi" role="button" tabindex="0" aria-label="make capital I">${firstChar}</span>`;
    const solved = capDone && dotDone;
    app.innerHTML = progressHTML() + `
      <p class="stage-instructions">${STAGES[3].instr}</p>
      <div class="icon-badge">${ICONS[s.icon]}</div>
      <p class="fixline">${iSpan}${rest}${dot}</p>
      <div class="feedback ${solved?'good':''}" role="status">${solved?'Capital I and a period. Perfect. ✓':''}</div>
      ${sentenceCounter()}
      <div class="actions">${listenBtn(s.text)}</div>
      ${navRow('Next →', solved)}`;
    wireSpeak();
    const ci=app.querySelector('#capi'); const d=app.querySelector('#dot');
    const capFn=()=>{ capDone=true; paint(); };
    const dotFn=()=>{ dotDone=true; paint(); };
    ci.onclick=capFn; ci.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();capFn();}};
    d.onclick=dotFn; d.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dotFn();}};
    if(solved) speak(s.text);
    wireNav();
  }
  paint();
}

/* ---------- 5. TYPE ---------- */
function norm(t){ return t.trim().replace(/\s+/g,' '); }
function renderType(){
  const s = SENTENCES[state.index];
  let done=false;
  app.innerHTML = progressHTML() + `
    <p class="stage-instructions">${STAGES[4].instr}</p>
    <div class="icon-badge">${ICONS[s.icon]}</div>
    <p class="model">${s.text}</p>
    <div class="actions">${listenBtn(s.text)}</div>
    <input class="type-input" id="ti" placeholder="Type here..." autocomplete="off" autocapitalize="off" spellcheck="false" />
    <div class="feedback" id="fb" role="status"></div>
    ${checklistHTML(['I use a capital I','I put a space between words','I use a period (.)'])}
    <div class="actions actions-split">
      <button class="btn btn-quiet" id="back">← Back</button>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" id="check">Check</button>
        <button class="btn btn-primary" id="next" disabled>Next →</button>
      </div>
    </div>`;
  wireSpeak();
  const input=app.querySelector('#ti'); const fb=app.querySelector('#fb'); const next=app.querySelector('#next');

  function updateChecklist(){
    const v=input.value;
    setCheck(0, /(^|\s)I(\s|$|[.])/.test(v) && !/(^|\s)i(\s|$)/.test(norm(v).split(' ')[0]==='i'?v:'') );
    // simpler: cap I present at start
    setCheck(0, norm(v).startsWith('I '));
    setCheck(1, /\s/.test(norm(v)));
    setCheck(2, /[.]\s*$/.test(v));
  }
  input.oninput=updateChecklist;

  app.querySelector('#check').onclick=()=>{
    const v=norm(input.value);
    if(v===s.text){
      fb.className='feedback good'; fb.textContent='Exactly right. ✓'; done=true; next.removeAttribute('disabled'); speak(s.text);
    } else if(v.toLowerCase()===s.text.toLowerCase() && /[.]$/.test(v) && !v.startsWith('I ')){
      fb.className='feedback try'; fb.textContent='So close — remember the capital I at the start.';
    } else if(v.replace(/[.]/g,'')===s.text.replace(/[.]/g,'') ){
      fb.className='feedback try'; fb.textContent='Add a period (.) at the very end.';
    } else if(v.toLowerCase().replace(/[. ]/g,'')===s.text.toLowerCase().replace(/[. ]/g,'')){
      fb.className='feedback try'; fb.textContent='The words are right — check the spaces, the capital I, and the period.';
    } else {
      fb.className='feedback try'; fb.textContent='Not yet — listen again and look at each word.';
    }
    updateChecklist();
  };
  app.querySelector('#back').onclick=goBack;
  next.onclick=advance;
  // allow skipping without getting stuck
  fb.insertAdjacentHTML('afterend','<button class="btn btn-quiet hint-toggle" id="skip">I want to move on</button>');
  app.querySelector('#skip').onclick=()=>{ next.removeAttribute('disabled'); advance(); };
  updateChecklist();
}

/* ---------- checklist helper ---------- */
function checklistHTML(items){
  return `<div class="checklist"><h3>Check your work</h3><ul>${
    items.map((t,i)=>`<li><span class="check-mark" id="ck${i}">✓</span>${t}</li>`).join('')
  }</ul></div>`;
}
function setCheck(i,on){ const c=app.querySelector('#ck'+i); if(c) c.classList.toggle('on',!!on); }

/* ---------- 6. WRITE ---------- */
const FRAMES = [
  {pre:"I wake up", suf:""},
  {pre:"I eat", suf:"for breakfast"},
  {pre:"I go to", suf:""},
  {pre:"I go home and", suf:""},
  {pre:"I go to bed", suf:""},
];
const BANK = ["early","late","at six","coffee","eggs","bread","work","school","class","watch TV","read","rest","cook dinner","see my family","at ten","at night"];

function renderWrite(){
  app.innerHTML = progressHTML() + `
    <p class="stage-instructions">${STAGES[5].instr}</p>
    <div id="frames">${
      FRAMES.map((f,i)=>`<div class="frame-row">
        <span class="frame-text">${f.pre}</span>
        <input class="frame-input" id="f${i}" autocomplete="off" />
        ${f.suf?`<span class="frame-text">${f.suf}</span>`:''}
        <span class="frame-text">.</span>
      </div>`).join('')
    }</div>
    <p class="wordbank-label">Tap a word to add it. You can also type your own.</p>
    <div class="wordbank">${BANK.map(w=>`<button class="chip" data-chip="${w}">${w}</button>`).join('')}</div>
    ${checklistHTML(['I start with a capital I','I put a space between words','I end with a period (.)'])}
    <div class="actions actions-split">
      <button class="btn btn-quiet" id="back">← Back</button>
      <button class="btn btn-primary" id="finish">Finish ✓</button>
    </div>`;

  let lastFocused = app.querySelector('#f0');
  app.querySelectorAll('.frame-input').forEach(inp=>{
    inp.addEventListener('focus',()=>lastFocused=inp);
    inp.addEventListener('input',()=>{
      const all=[...app.querySelectorAll('.frame-input')].map(x=>x.value).join(' ');
      setCheck(1, /\s/.test(all.trim()));
      setCheck(0, true); // frames already give them the capital I
      setCheck(2, true); // period is printed for them
    });
  });
  app.querySelectorAll('[data-chip]').forEach(c=>c.onclick=()=>{
    if(!lastFocused) lastFocused=app.querySelector('#f0');
    lastFocused.value = (lastFocused.value? lastFocused.value.trim()+' ':'') + c.dataset.chip;
    lastFocused.focus();
    lastFocused.dispatchEvent(new Event('input'));
  });
  app.querySelector('#back').onclick=goBack;
  app.querySelector('#finish').onclick=()=>{
    const lines = FRAMES.map((f,i)=>{
      const v = (app.querySelector('#f'+i).value||'').trim();
      return `${f.pre} ${v}${f.suf?' '+f.suf:''}.`.replace(/\s+/g,' ');
    });
    state.writing = lines.join('\n');
    renderDone();
  };
}

/* ---------- submission (hardened: hidden iframe + load confirm + timeout fallback) ---------- */
function isInApp(){
  const ua = navigator.userAgent || '';
  return /FBAN|FBAV|Instagram|Line\/|Twitter|WhatsApp|Snapchat|Pinterest|MicroMessenger/i.test(ua);
}
function sendToForm(data, onResult){
  const iframeName = 'gf_'+Date.now();
  const iframe = document.createElement('iframe');
  iframe.name = iframeName; iframe.style.display='none';
  document.body.appendChild(iframe);

  const form = document.createElement('form');
  form.action = FORM.action; form.method='POST'; form.target=iframeName; form.style.display='none';
  const add=(name,val)=>{ if(!name) return; const i=document.createElement('input'); i.type='hidden'; i.name=name; i.value=val==null?'':val; form.appendChild(i); };
  add(FORM.fields.studentName, data.studentName);
  add(FORM.fields.teacher,     data.teacher);
  add(FORM.fields.activity,    data.activity);
  add(FORM.fields.stages,      data.stages);
  add(FORM.fields.writing,     data.writing);
  document.body.appendChild(form);

  let done=false, submitted=false;
  const finish=(ok)=>{ if(done) return; done=true; try{form.remove();iframe.remove();}catch(e){} onResult(ok); };
  iframe.onload = ()=>{ if(submitted) finish(true); };       // real response after POST
  try { submitted=true; form.submit(); }
  catch(e){ finish(false); return; }
  setTimeout(()=>finish(true), 4500);                        // cross-origin: assume success
}

/* ---------- DONE ---------- */
function renderDone(){
  state.stage=STAGES.length-1;
  const warn = isInApp() ? `<div class="warn">⚠️ It looks like this opened inside an app (like Instagram or WhatsApp). To make sure your work is sent, tap the menu and choose <b>Open in browser</b> (Chrome or Safari) first.</div>` : '';
  app.innerHTML = `
    <div class="center">
      <div class="big-emoji">🌟</div>
      <h1>You did it!</h1>
      <p class="lead">You read, built, fixed, and wrote sentences about your day.</p>
      <div class="recap">
        <ul>
          <li>✅ You listened to and read 7 sentences</li>
          <li>✅ You put words in the right order</li>
          <li>✅ You added spaces, capital I, and periods</li>
          <li>✅ You wrote about your own day</li>
        </ul>
      </div>
      ${warn}
      <p class="sub">Send your work to your teacher when you are ready.</p>
      <div class="actions">
        <button class="btn btn-ghost" id="hear">Hear all the sentences</button>
        <button class="btn btn-primary" id="send">Send to my teacher ✓</button>
      </div>
      <div class="send-status" id="status" role="status"></div>
    </div>`;
  app.querySelector('#hear').onclick=()=>speak(SENTENCES.map(s=>s.text).join(' '));

  const sendBtn=app.querySelector('#send'), status=app.querySelector('#status');
  sendBtn.onclick=()=>{
    sendBtn.disabled=true; sendBtn.textContent='Sending…';
    status.style.color='var(--muted)'; status.textContent='';
    sendToForm({
      studentName: state.student || '(no name)',
      teacher:     state.teacher || '(none)',
      activity:    ACTIVITY_NAME,
      stages:      `${STAGES.length} of ${STAGES.length}`,
      writing:     state.writing || '(no writing)'
    }, (ok)=>{
      if(ok){
        status.style.color='var(--green)';
        status.innerHTML='✅ Sent! Your teacher has your work.';
        sendBtn.textContent='Sent ✓';
        const a=document.createElement('button'); a.className='btn btn-quiet hint-toggle'; a.textContent='Start again';
        a.onclick=()=>{ state.index=0; state.writing=''; renderIntro(); };
        status.after(a);
      } else {
        status.style.color='var(--orange)';
        status.textContent='Hmm, that did not send. Check your internet and try again.';
        sendBtn.disabled=false; sendBtn.textContent='Send to my teacher ✓';
      }
    });
  };
}

/* ---------- go ---------- */
renderIntro();
</script>
